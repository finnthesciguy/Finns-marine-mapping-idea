[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gulf-enc-catalog"
version = "0.1.0"
description = "Read NOAA's ENC product catalog, select Gulf Coast cells, snapshot/diff them and download changed cells."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "shapely>=2.0",
  "requests>=2.28",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
enc-catalog = "enc_catalog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
enc_catalog = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits NOAA servers; run only when ENC_CATALOG_LIVE=1"]
