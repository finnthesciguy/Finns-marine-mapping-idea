[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gulf-chart-build"
version = "0.1.0"
description = "Render NOAA chart raster tiles from the MCS export service into MBTiles region packages, update them incrementally and publish a ChartKit manifest."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "gulf-enc-catalog",
  "numpy>=1.24",
  "pillow>=10",
  "requests>=2.28",
  "shapely>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
chart-build = "chart_build.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chart_build = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: renders real tiles from NOAA; run only when CHART_BUILD_LIVE=1"]
