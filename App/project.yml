# XcodeGen spec for the iOS app. Generate the project with `xcodegen generate` in this directory
# (see README.md); GulfNav.xcodeproj and Info.plist are generated and not committed.
name: GulfNav

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    # Swift 5 language mode with complete strict-concurrency checking (warnings, not errors). See
    # README.md, "Swift language mode", for why the app target is not in Swift 6 mode yet.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  # MapLibre Native for iOS, binary distribution package (module `MapLibre`), pinned exactly.
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 7.0.0
  NavCore:
    path: ../Packages/NavCore
  ChartKit:
    path: ../Packages/ChartKit
  AppServices:
    path: ../Packages/AppServices

targets:
  GulfNav:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - PrivacyInfo.xcprivacy
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      # ChartKit's sample Gulf manifest, bundled as the region list for this first build.
      - path: ../Packages/ChartKit/Samples/gulf-manifest.sample.json
        buildPhase: resources
        group: Resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Gulf Nav
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: Gulf Nav shows your boat's position, speed and course on the chart. Your location stays on this device.
        # Background modes are deliberately not declared yet (track recording in the background comes later).
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.gulfnav
        PRODUCT_NAME: GulfNav
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES
    dependencies:
      - package: MapLibre
        product: MapLibre
      - package: NavCore
      - package: ChartKit
      - package: AppServices

schemes:
  GulfNav:
    build:
      targets:
        GulfNav: all
    run:
      config: Debug
    archive:
      config: Release
